<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aim Shooting Game</title>
  <style>
    body { text-align: center; font-family: Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
    #score-board { font-size: 24px; margin-bottom: 20px; color: #00ffcc; }
    #game-box { width: 320px; height: 400px; background: #222; margin: 0 auto; position: relative; border: 2px solid #00ffcc; border-radius: 10px; overflow: hidden; cursor: pointer; }
    #target { width: 50px; height: 50px; background: #ff0055; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🎯 Target Shooting Game</h1>
  <div id="score-board">Score: <span id="score">0</span></div>
  
  <div id="game-box">
    <div id="target" onclick="hitTarget()">SHOT</div>
  </div>

  <script>
    let score = 0;
    const target = document.getElementById('target');
    const scoreDisplay = document.getElementById('score');
    const gameBox = document.getElementById('game-box');

    function moveTarget() {
      const maxX = gameBox.clientWidth - 50;
      const maxY = gameBox.clientHeight - 50;
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);
      
      target.style.left = randomX + 'px';
      target.style.top = randomY + 'px';
    }

    function hitTarget() {
      score += 10;
      scoreDisplay.innerText = score;
      moveTarget();
    }

    // Start moving target
    moveTarget();
  </script>
</body>
</html>
