<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Game - GitHub Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px;
            font-size: 24px;
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 10px;
            color: #00ffcc;
        }
        canvas {
            background: #111;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Catch the Gems!</h1>
    <div id="score-board">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="instructions">Use <b>Left / Right Arrow Keys</b> or Mouse to move the basket.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;

        // Player (Basket)
        const player = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            width: 80,
            height: 15,
            speed: 8,
            dx: 0
        };

        // Falling Item (Gem)
        let item = {
            x: Math.random() * (canvas.width - 20),
            y: 0,
            radius: 12,
            speed: 4
        };

        let rightPressed = false;
        let leftPressed = false;

        // Controls
        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });

        // Mouse/Touch support
        document.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            player.x = mouseX - player.width / 2;
        });

        function update() {
            // Move Player
            if (rightPressed && player.x < canvas.width - player.width) {
                player.x += player.speed;
            } else if (leftPressed && player.x > 0) {
                player.x -= player.speed;
            }

            // Keep player inside canvas
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // Move Item
            item.y += item.speed;

            // Check Catch
            if (
                item.y + item.radius >= player.y &&
                item.x >= player.x &&
                item.x <= player.x + player.width
            ) {
                score += 10;
                resetItem();
                item.speed += 0.2; // Increase difficulty slightly
            }

            // Check Miss
            if (item.y > canvas.height) {
                lives--;
                resetItem();
                if (lives <= 0) {
                    alert("Game Over! Final Score: " + score);
                    document.location.reload();
                }
            }

            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;
        }

        function resetItem() {
            item.y = 0;
            item.x = Math.random() * (canvas.width - 30) + 15;
        }

        function draw() {
            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Item
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff0055";
            ctx.fill();
            ctx.closePath();
